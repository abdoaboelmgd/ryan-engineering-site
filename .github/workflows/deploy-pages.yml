name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Enable SPA routes on GitHub Pages
        run: |
          cp dist/public/index.html dist/public/404.html
          mkdir -p dist/public/thank-you
          cp dist/public/index.html dist/public/thank-you/index.html
          # Materialize campaign landing routes so direct requests return HTTP 200.
          for route in surveying-riyadh engineering-consulting-riyadh building-permits-riyadh; do
            mkdir -p "dist/public/lp/$route"
            cp dist/public/index.html "dist/public/lp/$route/index.html"
          done
          # Materialize the Sukuk service route and its short reference-style alias.
          mkdir -p dist/public/services/deed-update dist/public/sukuk
          cp dist/public/index.html dist/public/services/deed-update/index.html
          cp dist/public/index.html dist/public/sukuk/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
